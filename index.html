<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOCAL SPIN</title>
  <meta name="description" content="手元の音源をレコードの回転数で再生するWebアプリ。音源はブラウザ内だけで処理します。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 上部バー：タイトル・ファイル選択・曲名 -->
  <header class="top-bar">
    <h1 class="title">LOCAL SPIN</h1>

    <!-- ファイル読み込み：「ファイルを選ぶ」ボタン（ドロップは画面全体で受け付ける） -->
    <section class="file-picker" aria-labelledby="file-heading">
      <h2 id="file-heading" class="visually-hidden">音源ファイル</h2>
      <!-- input は見た目だけ隠し、キーボードでフォーカスできるようにする（display:none は使わない） -->
      <!-- フォーカス枠を label に出すため、input を label より前に置く -->
      <input type="file" id="file-input" class="visually-hidden" accept="audio/*">
      <label for="file-input" class="file-button">ファイルを選ぶ</label>
      <!-- 読み込んだ曲名を表示し、変化をスクリーンリーダーに伝える -->
      <p id="file-name" class="file-name" aria-live="polite">未選択（画面のどこにでもドロップできます）</p>
    </section>
  </header>

  <main class="deck">
    <!-- デッキ：台座＋レコード＋トーンアーム（見た目だけの部品なので、読み上げ対象から外す。
         再生位置の操作はシークバーで行う） -->
    <div class="deck-area" aria-hidden="true">
      <div class="turntable">
        <div class="record">
          <!-- ラベルの文字は、回っていることを目で分かるようにする印も兼ねる -->
          <div class="record-label"><span class="record-label-text">LOCAL SPIN</span></div>
        </div>
      </div>

      <!-- トーンアーム
           座標は「台座の直径 = 100」とした値。デッキの横幅は台座の 1.3 倍なので、横は 130 まで。
           レコードの中心は (50, 50)、アームの支点は (116, 16) -->
      <svg class="tonearm" viewBox="0 0 130 100">
        <!-- 支点の台（回らない） -->
        <circle class="tonearm-base" cx="116" cy="16" r="7" />

        <!-- 回る部分。支点を原点にして「真下向き」に描き、transform で支点へ移動して回す
             rotate の角度：27.4 で針先が一番外側の溝、45.5 で一番内側の溝（main.js で再生位置に合わせて変える） -->
        <g id="tonearm-arm" transform="translate(116 16) rotate(27.4)">
          <!-- カウンターウェイト（支点の後ろのおもり） -->
          <!-- （支点の台の半径 7 と重ならないよう、中心を支点から 12 離し、半径を 3 にしている） -->
          <circle class="tonearm-weight" cx="0" cy="-12" r="3" />
          <!-- アーム（まっすぐな棒）。カウンターウェイトからヘッドシェルまでつなぐ -->
          <rect class="tonearm-rod" x="-0.8" y="-12" width="1.6" height="76" rx="0.8" />
          <!-- 指掛け（フィンガーリフト）。ヘッドシェルの外側（+x がレコードの縁側）へ、ヘッドシェルに対して直角に短く出す -->
          <!-- （ヘッドシェルより先に描き、ヘッドシェルの下から生えているように見せる） -->
          <line class="tonearm-lift" x1="2" y1="67" x2="6.5" y2="67" />
          <!-- ヘッドシェル（先端の小さな四角）。針先がちょうど長さ 70 の位置に来る -->
          <rect class="tonearm-head" x="-3" y="63" width="6" height="9" rx="1" />
          <!-- 支点の軸 -->
          <circle class="tonearm-pivot" cx="0" cy="0" r="3" />
        </g>
      </svg>
    </div>

    <!-- 操作パネル -->
    <section class="panel" aria-labelledby="control-heading">
      <h2 id="control-heading" class="visually-hidden">操作</h2>

      <!-- 現在の再生速度（大きく表示）
           スライダーを動かすたびに読み上げると、スライダー自身の読み上げと重なるので aria-live は付けない -->
      <p class="speed">
        <span class="control-title">速度</span>
        <span id="speed-display" class="speed-value">100.0%</span>
      </p>
      <!-- 回転数や「0に戻す」で速度が変わったときだけ、ここに書いて読み上げる（画面には出さない） -->
      <p id="speed-announcer" class="visually-hidden" aria-live="polite"></p>

      <!-- 回転数：33／45／スクリューの3択
           見た目はボタンだが、中身はラジオ（矢印キーで切り替えられる） -->
      <fieldset class="mode">
        <legend class="control-title">回転数</legend>
        <div class="mode-options">
          <label class="mode-option">
            <input type="radio" name="speed-mode" value="33" class="visually-hidden" checked>
            <span>33回転</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="speed-mode" value="45" class="visually-hidden">
            <span>45回転</span>
          </label>
          <label class="mode-option">
            <input type="radio" name="speed-mode" value="screw" class="visually-hidden">
            <span>スクリュー</span>
          </label>
        </div>
      </fieldset>

      <!-- ピッチ：-8％〜+8％、0.1％刻みの縦フェーダー（Technics と同じく上が −、下が ＋） -->
      <div class="pitch">
        <label for="pitch-slider" class="control-title">ピッチ</label>
        <div class="pitch-body">
          <div class="fader">
            <!-- 目盛り（飾りなので読み上げない。値はスライダーの aria-valuetext で伝える） -->
            <div class="fader-scale" aria-hidden="true">
              <span class="fader-scale-top">−8</span>
              <span class="fader-scale-zero">0</span>
              <span class="fader-scale-bottom">+8</span>
            </div>
            <input type="range" id="pitch-slider" class="fader-input" min="-8" max="8" step="0.1" value="0">
          </div>
          <div class="pitch-side">
            <output id="pitch-value" class="pitch-value" for="pitch-slider">0.0%</output>
            <button type="button" id="pitch-reset" class="pitch-reset">0に戻す</button>
          </div>
        </div>
      </div>

      <!-- 再生位置：経過時間／曲の長さと、シークバー（曲を読み込むまでは操作できない） -->
      <div class="seek">
        <div class="seek-header">
          <label for="seek-bar" class="control-title">再生位置</label>
          <p class="seek-time"><span id="current-time">0:00</span> / <span id="duration">0:00</span></p>
        </div>
        <input type="range" id="seek-bar" class="seek-bar" min="0" max="0" step="1" value="0" disabled>
      </div>

      <!-- エラーメッセージ（表示されたらすぐ読み上げる） -->
      <p id="message" class="message" role="alert"></p>

      <!-- 再生／停止：ファイルを読み込むまでは押せない -->
      <button type="button" id="play-button" class="play-button" disabled>再生</button>
    </section>

    <!-- 音を鳴らす本体（画面には表示しない） -->
    <audio id="audio"></audio>
  </main>

  <footer class="note">
    <!-- 2つの span をそれぞれひとかたまりにして、改行するときは読点の後ろで折り返す -->
    <p><span class="note-line">音源はブラウザ内だけで処理され、</span><span class="note-line">外部に送信されません。</span></p>
  </footer>

  <!-- ファイルをドラッグしている間だけ、画面全体に出す表示（見た目だけなので読み上げない） -->
  <div class="drop-overlay" aria-hidden="true">
    <p>ドロップして読み込む</p>
  </div>

  <!-- aiff-to-wav.js の関数を main.js で使うので、先に読み込む -->
  <script src="js/aiff-to-wav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
